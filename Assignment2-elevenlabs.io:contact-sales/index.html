<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="leftstyles.css">
    <link rel="stylesheet" href="rightstyles.css">
</head>
<body>
    <div class="content">
        <div class="left-content">
            <div class="team-up">
                <div class="contact-team">
                    <img class="logo" src="./images/logo.svg" alt="">
                    <h1>Contact our sales team</h1>
                    <div class="team-content">
                        <div class="points">
                            <img src="/images/rocket.svg" alt="">
                            <span>Custom pricing and elevated concurrency</span>
                        </div>
                        <div class="points">
                            <img src="/images/shield.svg" alt="">
                            <span>Enterprise-grade security including SOC II, GDPR and HIPAA compliance</span>
                        </div>
                        <div class="points">
                            <img src="/images/enterprise.svg" alt="">
                            <span>Enterprise support and SLAs</span>
                        </div>
                    </div>
                </div>
            </div>
            <div class="team-down">
                <div class="business">
                    <div class="trust">Trusted by 10,000+ leading businesses</div>
                    <div class="company">
                        <img class="company-logo" src="./images/cisco-white.svg" alt="">
                        <img class="company-logo" src="./images/deutsche-telekom-white.svg" alt="">
                        <img class="company-logo" src="./images/walt-disney-studios-white.svg" alt="">
                        <img class="company-logo" src="./images/nvidia-white.svg" alt="">
                        <img class="company-logo" src="./images/salesforce-white.svg" alt="">
                    </div>
                    <div class="rating">
                        <div class="stars">
                            <img class="star" src="./images/star.png" alt="">
                            <img class="star" src="./images/star.png" alt="">
                            <img class="star" src="./images/star.png" alt="">
                            <img class="star" src="./images/star.png" alt="">
                            <img class="star" src="./images/star.png" alt="">
                        </div>
                        <span>4.5 stars and 1,059+ reviews</span>
                    </div>
                </div>
            </div>
        </div>
        <div class="right-content">
            <div class="form">
                <h2>Contact sales form</h2>
                <div class="form-info">Please fill out the form below to get started</div>
                <label class="label" for="webid">Company Website</label>
                <input type="text" name="" id="webid" placeholder="elevenlabs.io">
                <label class="label email-label" for="emailid">Business Email</label>
                <input type="email" name="" id="emailid" placeholder="example@elevenlabs.io">
                <div class="button-bar">
                    <button type="button">Next</button>
                    <div class="line-bar">
                        <div class="line first-line"></div>
                        <div class="line"></div>
                        <div class="line"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
